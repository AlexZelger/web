<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Alex Zelger{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #111111;
      --bg-raised: #191919;
      --fg:      #f2ece1;
      --muted:   #8a8681;
      --border:  #3a3835;
      --border-strong: #f2ece1;
      --brand:   #ff5a36;
      --accent-2: #d9c46a;

      /* Legacy tokens kept for the light-themed game sub-pages
         (wolves, draft, game, nfl, imposter) that still reference them. */
      --ink:    #0e0e0e;
      --paper:  #f4f1eb;
      --rule:   #d8d4cc;
      --accent: #1a3a2a;
      --gold:   #c9933a;
      --white:  #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main { flex: 1; }

    a { color: inherit; }

    /* ── Masthead ─────────────────────────────────────────────────────── */
    .masthead {
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .masthead-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0;
    }

    .masthead-name {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 2px solid var(--brand);
      padding-bottom: 2px;
    }

    .masthead-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .masthead-nav a {
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-decoration: none;
      padding-bottom: 3px;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .masthead-nav a:hover { color: var(--fg); }
    .masthead-nav a.active { color: var(--fg); border-color: var(--fg); }

    /* Mobile nav toggle */
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      flex-direction: column;
      gap: 5px;
      align-items: flex-end;
    }
    .nav-toggle span {
      display: block;
      height: 2px;
      background: var(--fg);
      transition: width 0.2s;
    }
    .nav-toggle span:nth-child(1) { width: 22px; }
    .nav-toggle span:nth-child(2) { width: 15px; }
    .nav-toggle span:nth-child(3) { width: 19px; }

    .mobile-nav {
      display: none;
      flex-direction: column;
      border-top: 1px solid var(--border);
      padding: 6px 0 14px;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .mobile-nav a:last-child { border-bottom: none; }
    .mobile-nav a:hover, .mobile-nav a.active { color: var(--fg); }

    /* ── Footer ──────────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 40px;
      margin-top: auto;
    }

    .footer-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-name {
      font-size: 13px;
      color: var(--muted);
    }

    .footer-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .footer-links a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--fg); }

    /* ── Shared utility classes ──────────────────────────────────────── */
    .tag {
      font-size: 11px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .tag.highlight {
      border-color: var(--accent-2);
      color: var(--accent-2);
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 720px) {
      .masthead { padding: 0 20px; }
      .masthead-nav { display: none; }
      .nav-toggle { display: flex; }
      footer { padding: 22px 20px; }
    }
  </style>

  {% block head %}{% endblock %}
</head>
<body>

  <!-- ── Masthead ── -->
  <header class="masthead">
    <div class="masthead-inner">
      <a href="/" class="masthead-name">alexzelger.com</a>
      <nav class="masthead-nav">
        <a href="/"          class="{{ 'active' if request.path == '/' }}">blog</a>
        <a href="/portfolio" class="{{ 'active' if request.path == '/portfolio' }}">projects</a>
        <a href="/about"     class="{{ 'active' if request.path == '/about' }}">about</a>
        <a href="mailto:AlexTZelger@gmail.com">contact</a>
      </nav>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-nav" id="mobile-nav">
      <a href="/"          class="{{ 'active' if request.path == '/' }}">blog</a>
      <a href="/portfolio" class="{{ 'active' if request.path == '/portfolio' }}">projects</a>
      <a href="/about"     class="{{ 'active' if request.path == '/about' }}">about</a>
      <a href="mailto:AlexTZelger@gmail.com">contact</a>
    </div>
  </header>

  <!-- ── Page content ── -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ── -->
  <footer>
    <div class="footer-inner">
      <span class="footer-name">© Alex Zelger</span>
      <div class="footer-links">
        <a href="https://github.com/AlexZelger"    target="_blank" rel="noopener">GitHub</a>
        <a href="https://linkedin.com/in/Alex-Zelger" target="_blank" rel="noopener">LinkedIn</a>
        <a href="mailto:AlexTZelger@gmail.com">Email</a>
      </div>
    </div>
  </footer>

  <script>
    function toggleNav() {
      document.getElementById('mobile-nav').classList.toggle('open');
    }
    // Close mobile nav on outside click
    document.addEventListener('click', (e) => {
      const nav    = document.getElementById('mobile-nav');
      const toggle = document.querySelector('.nav-toggle');
      if (nav.classList.contains('open') && !nav.contains(e.target) && !toggle.contains(e.target)) {
        nav.classList.remove('open');
      }
    });
  </script>

  {% block scripts %}{% endblock %}

</body>
</html>
